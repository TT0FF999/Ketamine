name: Build and Release iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout du projet
        uses: actions/checkout@v4

      - name: Forcer l'utilisation de Xcode 15.2
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.2'

      - name: Installer XcodeGen
        run: brew install xcodegen

      - name: Générer le projet Xcode
        run: xcodegen generate

      - name: Résoudre les dépendances Swift (SPM)
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Ketamine.xcodeproj \
            -scheme Ketamine

      - name: Build de l'application (.app)
        run: |
          xcodebuild build \
            -project Ketamine.xcodeproj \
            -scheme Ketamine \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            OTHER_CFLAGS="-Wno-error=implicit-function-declaration -Wno-error=incompatible-pointer-types" \
            | grep -E "error:|FAILED:|warning:" || true
          
          # Vérification de l'existence du fichier binaire après build
          if [ ! -d "build/Build/Products/Release-iphoneos/Ketamine.app" ]; then
            echo "❌ La compilation a échoué. Le fichier .app n'a pas été généré."
            exit 1
          fi

      - name: Paquetage et Pseudo-signature (.ipa)
        run: |
          # 1. Installation de ldid pour la pseudo-signature ad-hoc
          brew install ldid

          APP_PATH="build/Build/Products/Release-iphoneos/Ketamine.app"

          # 2. Rendre le binaire explicitement exécutable (évite le Bad file descriptor)
          chmod +x "$APP_PATH/Ketamine"

          # 3. Pseudo-signature avec entitlements si présent, sinon ad-hoc générique
          ENTITLEMENTS=$(find . -name "*.entitlements" -maxdepth 3 | head -n 1)
          if [ -n "$ENTITLEMENTS" ]; then
            echo "Aplication des entitlements : $ENTITLEMENTS"
            ldid -S"$ENTITLEMENTS" "$APP_PATH/Ketamine"
          else
            echo "Signature ad-hoc générique sans fichier entitlements dédié."
            ldid -S "$APP_PATH/Ketamine"
          fi

          # 4. Emballage dans le dossier Payload en conservant les permissions et liens symboliques
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r --symlinks Ketamine.ipa Payload

      - name: Créer la Release GitHub et le Tag
        uses: softprops/action-gh-release@v2
        with:
          files: Ketamine.ipa
          tag_name: v1.0.${{ github.run_number }}
          name: Release v1.0.${{ github.run_number }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
